server {
  listen 80;
  index index.html;

  # Перенаправляем запросы к API на контейнер бэкенда
  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000;
  }

  # Перенаправляем запросы к админке Django на контейнер бэкенда
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000;
  }

  # Раздача картинок, загруженных пользователями (требование ТЗ)
  location /media/ {
    alias /var/html/media/;
  }

  # Раздача фронтенда и статики
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
